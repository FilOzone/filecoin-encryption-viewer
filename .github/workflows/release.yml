name: Release

# Everything release-please creates with GITHUB_TOKEN (the release PR, its pushes, the tag and the release) triggers
# no other workflow, so publishing is chained here on `release_created` instead of on a tag or release event.
on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      sha: ${{ steps.release.outputs.sha }}
      pr_branch: ${{ steps.pr.outputs.branch }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # `pr` is set when this run created or updated the release PR: every run, with `always-update`.
      - name: Release PR branch
        id: pr
        if: steps.release.outputs.pr
        env:
          PR: ${{ steps.release.outputs.pr }}
        run: echo "branch=$(jq -r .headBranchName <<< "$PR")" >> "$GITHUB_OUTPUT"

  # Records the release PR's viewer CID in the README, keyed by its upcoming tag. release-please rewrites its branch on
  # every push to main, dropping this commit, so it runs again each time. Like everything pushed with GITHUB_TOKEN, this
  # triggers no PR checks; release PRs get none at all.
  release-pr-readme:
    needs: release-please
    if: needs.release-please.outputs.pr_branch != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    concurrency:
      group: release-pr-readme
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.pr_branch }}
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      # The token reaches git only through GIT_CONFIG_* environment variables, never a command line or the log.
      - name: Commit the README row
        env:
          BRANCH: ${{ needs.release-please.outputs.pr_branch }}
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v$(node -p "require('./package.json').version")"
          cid="$(node scripts/release.ts cid)"
          node scripts/release.ts readme-set "$tag" "$cid"
          if git diff --quiet README.md; then
            echo "README already records the viewer CID for $tag"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "docs: record the viewer CID for $tag" README.md
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          echo "::add-mask::$auth"
          GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=http.https://github.com/.extraheader \
            GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $auth" git push origin "HEAD:$BRANCH"

  # No secrets. Checks and builds the released commit once, for upload to publish, and decides whether to deploy: only
  # when the CID differs from the previous row in the README table. A release that doesn't change the viewer deploys
  # nothing, so a rollback stays in place until one does.
  deploy-check:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      cid: ${{ steps.check.outputs.cid }}
      deploy: ${{ steps.check.outputs.deploy }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.sha }}
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Release PRs get no checks, so the released commit is checked here before it's built.
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm exec biome check .
      - run: pnpm build

      - name: Compare with the README
        id: check
        env:
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          cid="$(node scripts/release.ts cid)"
          recorded="$(node scripts/release.ts readme-get "$TAG")"
          if [ "$cid" != "$recorded" ]; then
            echo "::error::$TAG builds $cid, but README.md records $recorded"
            exit 1
          fi
          previous="$(node scripts/release.ts readme-previous "$TAG")"
          echo "cid=$cid" >> "$GITHUB_OUTPUT"
          if [ "$cid" = "$previous" ]; then
            echo "::notice::$TAG doesn't change the viewer ($cid); nothing to deploy"
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: viewer
          path: dist/index.html
          retention-days: 3
          if-no-files-found: error

  # Only the wallet key, in the `upload` environment (main only, no reviewers). It runs third-party code (webmaster and
  # its dependencies), so it never holds the Cloudflare token: that is the dnslink job's, on another runner.
  upload:
    needs: [release-please, deploy-check]
    if: needs.deploy-check.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: upload
    permissions:
      contents: read
      actions: read
    steps:
      # deploy-check's build, not rebuilt here.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: viewer
          path: dist

      # Stores the folder on two providers, deposits from the wallet when it's short, and waits until a provider serves
      # the CID. No dnslink-name: the DNSLink is switched by the dnslink job.
      - name: Upload to mainnet
        id: webmaster
        uses: FilOzone/filoz-webmaster@5aa0da17c4e30e23601826cbeeaba203a451c031 # FilOzone/filoz-webmaster#3
        with:
          path: dist
          private-key: ${{ secrets.FILECOIN_WALLET_KEY }}
          network: mainnet

      - name: Check the uploaded CID
        env:
          CID: ${{ needs.deploy-check.outputs.cid }}
          UPLOADED: ${{ steps.webmaster.outputs.cid }}
        run: |
          if [ "$UPLOADED" != "$CID" ]; then
            echo "::error::uploaded $UPLOADED, but deploy-check built $CID"
            exit 1
          fi

  # Only the Cloudflare token, in the `release` environment, which holds the approval. Runs only scripts/release.ts.
  dnslink:
    needs: [release-please, deploy-check, upload]
    runs-on: ubuntu-latest
    timeout-minutes: 75
    environment: release
    # Shared with the Rollback workflow: one DNSLink change at a time. A newer queued run replaces an older queued one,
    # which then never starts, so the viewer is left as it was, never half-switched.
    concurrency:
      group: dnslink
      cancel-in-progress: false
    permissions:
      contents: read
    outputs:
      previous: ${{ steps.dnslink.outputs.previous }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.sha }}
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      # Runtime dependencies only, and no lifecycle scripts next to the Cloudflare token.
      - run: pnpm install --frozen-lockfile --prod --ignore-scripts

      # inbrowser.link finds providers through cid.contact, so the stable URL waits until it can load the new build.
      - name: Wait for cid.contact
        env:
          CID: ${{ needs.deploy-check.outputs.cid }}
        run: node scripts/release.ts wait-indexed "$CID" 45

      # Inside the dnslink lock, so a newer release that finished first is never overwritten by an older one.
      - name: Refuse unless this is the latest release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          latest="$(gh release list --limit 1 --exclude-drafts --exclude-pre-releases --json tagName --jq '.[0].tagName')"
          if [ "$latest" != "$TAG" ]; then
            echo "::error::$TAG is not the latest release ($latest); not switching the DNSLink"
            exit 1
          fi

      # Skips the PATCH when the record already names the CID (a re-run). Records the previous CID before verifying.
      - name: Point the DNSLink at the release
        id: dnslink
        env:
          CID: ${{ needs.deploy-check.outputs.cid }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ vars.CLOUDFLARE_ZONE_ID }}
          DNSLINK_RECORD_ID: ${{ vars.DNSLINK_RECORD_ID }}
        run: |
          previous="$(node scripts/release.ts dnslink-set "$CID")"
          echo "previous=$previous" >> "$GITHUB_OUTPUT"

      - name: Verify the DNSLink and the redirect
        env:
          CID: ${{ needs.deploy-check.outputs.cid }}
        run: node scripts/release.ts dnslink-verify "$CID"

  # Separate so neither secret-holding job has a token that can write to the repo.
  release-notes:
    needs: [release-please, deploy-check, dnslink]
    # When there's nothing to deploy, or after a successful deploy; never after a failed upload or DNSLink switch.
    if: >-
      always() && needs.deploy-check.result == 'success' &&
      (needs.deploy-check.outputs.deploy != 'true' || needs.dnslink.result == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Add the CIDs to the release notes
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
          CID: ${{ needs.deploy-check.outputs.cid }}
          DEPLOYED: ${{ needs.deploy-check.outputs.deploy }}
          PREVIOUS: ${{ needs.dnslink.outputs.previous }}
        run: |
          body="$(gh release view "$TAG" --json body --jq .body)"
          if grep -q '^## Viewer$' <<< "$body"; then
            echo "The release notes already have a Viewer section"
            exit 0
          fi
          {
            printf '%s\n' "$body"
            printf '\n## Viewer\n\n'
            printf -- '- Viewer CID: `%s`\n' "$CID"
            if [ "$DEPLOYED" = true ]; then
              printf -- '- Previous viewer CID: `%s`\n' "${PREVIOUS:-none}"
            else
              printf -- '- Not deployed: this release builds the same viewer as the previous one\n'
            fi
            printf -- '- Stable URL: https://viewer.filecoin.cloud/ (DNSLink `_dnslink.viewer.filecoin.cloud`)\n'
          } > notes.md
          gh release edit "$TAG" --notes-file notes.md
