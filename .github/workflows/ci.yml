name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Node 24 and pnpm 10.7.0 (packageManager): another toolchain can change the viewer CID.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm exec biome check .

      # No wallet and no secrets, so fork PRs run it too: packs dist/ as a release would and reports its root CID.
      - name: Dry-run publish
        id: webmaster
        uses: FilOzone/filoz-webmaster@5aa0da17c4e30e23601826cbeeaba203a451c031 # FilOzone/filoz-webmaster#3
        with:
          path: dist
          dry-run: "true"

      - name: Viewer CID
        env:
          PACKED: ${{ steps.webmaster.outputs.cid }}
        run: |
          cid="$(node scripts/release.ts cid)"
          if [ "$cid" != "$PACKED" ]; then
            echo "::error::scripts/release.ts computes $cid, but webmaster packs $PACKED"
            exit 1
          fi
          echo "Viewer CID: \`$cid\`" >> "$GITHUB_STEP_SUMMARY"
